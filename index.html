<style>
:root{
  --bg:#211a16; --bg-2:#2a221d; --ink:#efe7dd; --ink-dim:#b3a598;
  --radius:12px;
  --display:"Fraunces", Georgia, serif;
  --body:system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box; margin:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--body);
  display:flex; flex-direction:column; height:100dvh;
  overflow:hidden; overscroll-behavior-y:none;
}
header{
  display:flex; align-items:baseline; justify-content:space-between; gap:1rem;
  padding:1.1rem 1.4rem .6rem;
}
.wordmark{font-family:var(--display); font-weight:600; font-size:1.25rem; letter-spacing:.01em}
.wordmark em{font-style:italic; color:var(--ink-dim)}
.hcontrols{display:flex; align-items:center; gap:.6rem; flex-wrap:wrap}
#search{
  font:inherit; font-size:.85rem; background:transparent; color:var(--ink);
  border:1px solid #4a3d33; border-radius:999px; padding:.35rem .9rem;
  width:clamp(130px,26vw,220px);
}
#search::placeholder{color:var(--ink-dim)}
.tile .stack{display:flex; flex-direction:column; gap:.2rem; min-width:0}
.tile .ctx{font-size:.66rem; opacity:.8; line-height:1.25; font-family:var(--body)}
.seg{display:flex; border:1px solid #4a3d33; border-radius:999px; overflow:hidden}
.seg button{
  font:inherit; font-size:.8rem; padding:.35rem .9rem; border:0; cursor:pointer;
  background:transparent; color:var(--ink-dim);
}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--bg); font-weight:600}

#strata{display:flex; flex-direction:column}
.stratum{
  display:flex; align-items:center; gap:.7rem; width:100%; border:0; cursor:pointer;
  padding:.5rem 1.4rem; font:inherit; text-align:left;
  animation:drop .25s ease both;
}
.stratum .lbl{font-family:var(--display); font-weight:600; font-size:1rem}
.stratum.home{background:var(--bg-2); color:var(--ink-dim); border-bottom:1px solid #453a31}
.stratum.home .lbl{font-size:.85rem; font-weight:500; font-style:italic}
.stratum .hint{margin-left:auto; font-size:.75rem; opacity:0; transition:opacity .15s}
.stratum:hover .hint, .stratum:focus-visible .hint{opacity:.8}
.stratum.out{animation:rise .22s ease both; pointer-events:none}
@keyframes drop{from{transform:translateY(-8px); opacity:0}}
@keyframes rise{to{transform:translateY(-8px); opacity:0}}

main{flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; overscroll-behavior-y:contain; display:flex; flex-direction:column; padding:1rem 1.4rem 2rem; max-width:1100px; width:100%; margin:0 auto}
.prompt{
  font-family:var(--display); font-weight:500; font-size:clamp(1.6rem,4vw,2.4rem);
  margin:.8rem 0 1.2rem; letter-spacing:-.01em;
}
.prompt small{display:block; font-family:var(--body); font-size:.85rem; color:var(--ink-dim); margin-top:.35rem; letter-spacing:0}

.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:.7rem}
.tile{
  position:relative; aspect-ratio:1; border:0; border-radius:var(--radius); cursor:pointer;
  padding:.8rem; display:flex; align-items:flex-end; text-align:left; overflow:hidden;
  font:inherit; animation:pop .3s ease both;
  transition:transform .15s ease, filter .15s ease;
}
.tile:hover{transform:translateY(-3px) scale(1.015); filter:brightness(1.08)}
.tile:active{transform:scale(.98)}
.tile .lbl{font-family:var(--display); font-weight:600; font-size:1.05rem; line-height:1.15}
.tile .count{
  position:absolute; top:.6rem; right:.7rem; font-size:.72rem; opacity:.65; font-variant-numeric:tabular-nums;
}
@keyframes pop{from{transform:translateY(10px); opacity:0}}

/* flavor notes are round swatches; categories stay square drawers */
.tile.is-leaf{border-radius:50%; align-items:center; justify-content:center; text-align:center; padding:1.1rem}
.tile.is-leaf .lbl{font-weight:500; font-size:.98rem; transform:translateY(2px)}
.card.is-leaf{aspect-ratio:1; border-radius:50%; align-items:center; justify-content:center; text-align:center; padding:2rem}
.card.is-leaf .lbl{font-weight:500; font-size:1.7rem; transform:translateY(5px)}

/* cards mode */
.stage{flex:1; display:flex; align-items:center; justify-content:center; gap:1rem; min-height:0}
.nav{
  font:inherit; font-size:1.6rem; width:2.6rem; height:2.6rem; border-radius:50%;
  border:1px solid #4a3d33; background:transparent; color:var(--ink); cursor:pointer; flex:none;
}
.nav:hover{background:var(--bg-2)}
.card-wrap{width:min(78vw,360px,36dvh); touch-action:pan-y}
.card{
  position:relative; width:100%; aspect-ratio:3/4; border:0; border-radius:20px; cursor:pointer;
  padding:1.4rem; display:flex; flex-direction:column; justify-content:flex-end; align-items:flex-start;
  text-align:left; overflow:hidden; font:inherit; will-change:transform;
  box-shadow:0 18px 40px rgba(0,0,0,.4);
}
.card .lbl{font-family:var(--display); font-weight:600; font-size:2rem; line-height:1.05}
.card .sub{font-size:.8rem; margin-top:.5rem; opacity:.75}
.card .count{position:absolute; top:1rem; right:1.1rem; font-size:.8rem; opacity:.65}
.card.in-l{animation:inL .22s ease both} .card.in-r{animation:inR .22s ease both}
@keyframes inL{from{transform:translateX(-40px); opacity:0}}
@keyframes inR{from{transform:translateX(40px); opacity:0}}
.counter{text-align:center; color:var(--ink-dim); font-size:.85rem; margin-top:1rem; font-variant-numeric:tabular-nums}

/* leaf terminal view */
.leaf{
  margin:auto; width:min(70vw,380px); aspect-ratio:1; border-radius:50%; overflow:hidden;
  display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:2rem;
  box-shadow:0 18px 40px rgba(0,0,0,.4); animation:pop .3s ease both;
}
.leaf .lbl{font-family:var(--display); font-weight:600; font-size:2.4rem; transform:translateY(6px)}
.leaf-note{text-align:center; color:var(--ink-dim); font-size:.85rem; margin-top:1.2rem}

button:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
@media (prefers-reduced-motion: reduce){
  *{animation:none !important; transition:none !important}
}
</style>
</head>
<body>
<header>
  <div class="wordmark">Flavor <em>Explorer</em></div>

  </div>
  </div>
</header>
<nav id="strata" aria-label="Tasting path"></nav>
<main id="main"></main>

  'Spice & Woody':{Spice:['Clove Honey','Warm Anise','Spiced Rum Note'],
    Woody:['Sap Bucket Wood','Sugar Shack Steam','Split Firewood']}}

// ---------- color helpers ----------
function hexToHsl(hex){
  const n=parseInt(hex.slice(1),16), r=(n>>16&255)/255, g=(n>>8&255)/255, b=(n&255)/255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b), d=max-min; let h=0;
  if(d){ h= max===r ? ((g-b)/d+(g<b?6:0)) : max===g ? (b-r)/d+2 : (r-g)/d+4; h*=60; }
  const l=(max+min)/2, s=d?d/(1-Math.abs(2*l-1)):0;
  return [h,s*100,l*100];
}
const hsl=([h,s,l])=>`hsl(${h.toFixed(1)} ${s.toFixed(1)}% ${l.toFixed(1)}%)`;
const parseC=c=>c[0]==='#'?hexToHsl(c):c.match(/[\d.]+/g).map(Number);
// label hash → color/texture depend on the NAME, not sibling position, so a note
// looks identical in Essentials and Everything even as siblings appear around it
const hashL=s=>{let h=0; for(const c of s.toLowerCase()) h=(h*31+c.charCodeAt(0))>>>0; return h;};
function derive(base,label){ // vary lightness + drift hue within the parent's hue family
  const [h,s,l]=parseC(base);
  const t=(hashL(label)%97)/96;
  return [h+(t-.5)*22, Math.min(s+6,90), Math.max(20,Math.min(76, l-11+t*24))];
}
function luminance(cssColor){ // via canvas-free HSL/hex parse: we only feed hsl() or hex
  let r,g,b;
  if(cssColor[0]==='#'){ const n=parseInt(cssColor.slice(1),16); r=n>>16&255; g=n>>8&255; b=n&255; }
  else{ const [h,s,l]=cssColor.match(/[\d.]+/g).map(Number);
    const a=s/100*Math.min(l/100,1-l/100);
    const f=k=>{k=(k+h/30)%12; return l/100-a*Math.max(-1,Math.min(k-3,9-k,1));};
    r=f(0)*255; g=f(8)*255; b=f(4)*255; }
  return (0.2126*r+0.7152*g+0.0722*b)/255;
}
const inkFor=c=>luminance(c)>0.52?'#241a12':'#f7efe4';

// ---------- normalize data into one tree ----------
// detail levels: a category key or flavor name ending in '*' only exists in
// "Everything" mode; without the star it appears in both. Star is stripped for display.
const DEEP=/\*$/;
function makeNode(label,spec,color,deep){
  const node={label,color};
  if(Array.isArray(spec)){
    const leaves=spec.filter(s=>deep||!DEEP.test(s)), seen=new Set();
    node.children=leaves.map(s=>{const l=s.replace(DEEP,''); return {label:l,color:hsl(derive(color,l))};})
      .filter(c=>!seen.has(c.label)&&seen.add(c.label)); // dedupe: starred + EXTRA may name the same note
  }else if(spec&&spec.subs){
    const keys=Object.keys(spec.subs).filter(k=>deep||!DEEP.test(k));
    node.children=keys.map(k=>{
      const child=spec.subs[k], l=k.replace(DEEP,'');
      const c=child.color||hsl(derive(spec.color||color,l));
      return makeNode(l,child,c,deep);
    });
  }
  return node;
}
// EXTRA holds Everything-only bulk data (defined below DATA): same shape, no stars needed.
// Arrays append to existing subs; unknown keys add whole new subs/families (full DATA format).
function deepData(){
  const d=structuredClone(DATA);
  for(const EX of [EXTRA,EXTRA2]) for(const s in EX){
    (function merge(t,e){
      for(const k in e){
        if(!(k in t)){ t[k]=structuredClone(e[k]); continue; } // clone: never alias EXTRA into the tree
        if(Array.isArray(t[k])&&Array.isArray(e[k])) t[k]=t[k].concat(e[k]);
        else merge(t[k].subs,e[k]);
      }
    })(d[s].subs,EX[s]);
  }
  return d;
}
function buildRoot(deep){
  const data=deep?deepData():DATA;
  const root={label:'Flavor Explorer',children:Object.keys(data).map(k=>makeNode(k,data[k],data[k].color,deep))};
  // collapse single-child chains: a category with one subcategory adopts its children directly
  (function collapse(n){
    if(!n.children) return;
    n.children.forEach(collapse);
    while(n.children.length===1&&n.children[0].children) n.children=n.children[0].children;
  })(root);
  return root;
}
let depth=localStorage.getItem('fx-depth')||'basic';
let ROOT=buildRoot(depth==='deep');

const PROMPTS=[
  ['What are you tasting?','Pick a subject — each one has its own wheel.'],
  ['Which family calls out?','Trust your first impression.'],
  ['Getting closer — which kind?',''],
  ['Name it.','Tap the flavor that matches.']
];
const TEXTURES=[
  {i:'radial-gradient(circle at 2px 2px, rgba(255,255,255,.28) 1.2px, transparent 1.4px)', s:'13px 13px'},
  {i:'repeating-linear-gradient(45deg, rgba(255,255,255,.10) 0 2px, transparent 2px 11px)', s:'auto'},
  {i:'repeating-linear-gradient(0deg, rgba(0,0,0,.14) 0 1px, transparent 1px 9px)', s:'auto'},
  {i:'repeating-linear-gradient(45deg, rgba(255,255,255,.07) 0 1px, transparent 1px 8px), repeating-linear-gradient(-45deg, rgba(0,0,0,.08) 0 1px, transparent 1px 8px)', s:'auto'},
  {i:'repeating-radial-gradient(circle at 72% 28%, rgba(255,255,255,.09) 0 2px, transparent 2px 13px)', s:'auto'},
  {i:'radial-gradient(circle at 6px 6px, rgba(0,0,0,.15) 2px, transparent 2.4px)', s:'19px 19px'}
];
function paint(el,node){ // texture from the label hash — stable across modes
  const t=TEXTURES[hashL(node.label)%TEXTURES.length];
  el.style.background=`${t.i} ${node.color}`;
  el.style.backgroundSize=t.s;
  el.style.backgroundColor=node.color;
  el.style.color=inkFor(node.color);
}

// ---------- state ----------
let path=[ROOT], mode=localStorage.getItem('fx-mode')||'grid', cardIndex=0, lastDir='r';
const $=s=>document.querySelector(s);

function setMode(m){
  mode=m; localStorage.setItem('fx-mode',m);
  $('#mGrid').setAttribute('aria-pressed',m==='grid');
  $('#mCards').setAttribute('aria-pressed',m==='cards');
  render();
}
$('#mGrid').onclick=()=>setMode('grid');
$('#mCards').onclick=()=>setMode('cards');

// the hash is the source of truth: navigation just sets it, applyHash renders
const pathToHash=p=>'#/'+p.slice(1).map(n=>encodeURIComponent(n.label)).join('/');
function drill(node){ lastDir='r'; location.hash=pathToHash([...path,node]); }
function jumpTo(level){ location.hash=pathToHash(path.slice(0,level+1)); }
function applyHash(){
  const labels=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean).map(decodeURIComponent);
  const old=path, p=[ROOT];
  for(const l of labels){
    const n=p.at(-1).children?.find(c=>c.label===l);
    if(!n) break;
    p.push(n);
  }
  const removed=old[p.length]; // set when navigating up: the child we came from
  cardIndex=removed?Math.max(0,(p.at(-1).children||[]).indexOf(removed)):0;
  path=p; render();
}
window.addEventListener('hashchange',applyHash);

const HOME={home:true};
function makeStratum(entry,k){ // k = index in the entries list; for real nodes, path[k]
  const b=document.createElement('button');
  if(entry===HOME){
    b.className='stratum home';
    b.innerHTML=`<span class="lbl">What are you tasting?</span><span class="hint">start over ↩</span>`;
    b.onclick=()=>jumpTo(0);
  }else{
    b.className='stratum'; paint(b,entry,k-1);
    b.innerHTML=`<span class="lbl"></span><span class="hint">return here ↩</span>`;
    b.querySelector('.lbl').textContent=entry.label;
    b.onclick=()=>jumpTo(k);
  }
  b._node=entry;
  return b;
}
function renderStrata(){
  // diff against current DOM: untouched bars keep their elements (no animation replay),
  // only appended bars drop in and removed bars rise out
  const strata=$('#strata');
  const entries=path.length>1?[HOME,...path.slice(1)]:[];
  const existing=[...strata.children].filter(el=>!el.classList.contains('out'));
  let keep=0;
  while(keep<existing.length&&keep<entries.length&&existing[keep]._node===entries[keep]) keep++;
  existing.slice(keep).forEach(el=>{
    el.classList.add('out');
    el.onanimationend=()=>el.remove();
    setTimeout(()=>el.remove(),400); // reduced-motion: no animationend fires
  });
  entries.slice(keep).forEach((e,i)=>{
    strata.insertBefore(makeStratum(e,keep+i),strata.querySelector('.out'));
  });
}
// flat index of every category and note, with its full chain for navigation
function buildIndex(root){
  const ix=[];
  (function idx(n,chain){
    (n.children||[]).forEach((c,i)=>{ const ch=[...chain,c]; ix.push({node:c,chain:ch,i}); idx(c,ch); });
  })(root,[]);
  return ix;
}
let INDEX=buildIndex(ROOT);

function setDepth(d){
  depth=d; localStorage.setItem('fx-depth',d);
  $('#dBasic').setAttribute('aria-pressed',d==='basic');
  $('#dDeep').setAttribute('aria-pressed',d==='deep');
  ROOT=buildRoot(d==='deep'); INDEX=buildIndex(ROOT);
  applyHash(); // re-resolve the current URL against the rebuilt tree
}
$('#dBasic').onclick=()=>setDepth('basic');
$('#dDeep').onclick=()=>setDepth('deep');

function renderSearch(q){
  const main=$('#main'); main.innerHTML='';
  const ql=q.toLowerCase();
  const scope=path.length>1?path[1]:null; // inside a wheel, search only that wheel
  const hits=INDEX.filter(e=>(!scope||e.chain[0]===scope)&&e.node.label.toLowerCase().includes(ql));
  hits.sort((a,b)=>{const al=a.node.label.toLowerCase(),bl=b.node.label.toLowerCase();
    return (bl.startsWith(ql)-al.startsWith(ql))||al.localeCompare(bl);});
  const h=document.createElement('h1'); h.className='prompt';
  h.textContent=(hits.length?`${hits.length} match${hits.length===1?'':'es'}`:'No matches')+(scope?` in ${scope.label}`:'');
  if(!hits.length){const s=document.createElement('small');s.textContent='Try a shorter word — “berry”, “smoke”, “floral”…';h.appendChild(s);}
  main.appendChild(h);
  const g=document.createElement('div'); g.className='grid';
  hits.slice(0,60).forEach((e,gi)=>{
    const b=document.createElement('button');
    b.className=e.node.children?'tile':'tile is-leaf'; paint(b,e.node,e.i);
    b.style.animationDelay=`${Math.min(gi*14,400)}ms`;
    if(e.node.children){const c=document.createElement('span');c.className='count';c.textContent=e.node.children.length;b.appendChild(c);}
    const st=document.createElement('span'); st.className='stack';
    const l=document.createElement('span'); l.className='lbl'; l.textContent=e.node.label; st.appendChild(l);
    const crumbs=e.chain.slice(scope?1:0,-1).map(n=>n.label).join(' › ');
    if(crumbs){const x=document.createElement('span'); x.className='ctx'; x.textContent=crumbs; st.appendChild(x);}
    b.appendChild(st);
    b.onclick=()=>{ $('#search').value='';
      const target=pathToHash([ROOT,...e.chain]);
      if(location.hash===target) render(); else location.hash=target; };
    g.appendChild(b);
  });
  main.appendChild(g);
  if(hits.length>60){const p=document.createElement('p'); p.className='leaf-note';
    p.textContent=`Showing 60 of ${hits.length} — keep typing to narrow down.`; main.appendChild(p);}
}

function render(){
  const cur=path.at(-1);
  renderStrata();
  $('#search').placeholder=path.length>1?`Search ${path[1].label}…`:'Search flavors…';
  const q=$('#search').value.trim();
  if(q.length>=2){ renderSearch(q); return; }

  const main=$('#main'); main.innerHTML='';
  if(!cur.children){ renderLeaf(main,cur); return; }

  const depth=Math.min(path.length-1,PROMPTS.length-1);
  // levels can vary in depth now — if this level holds flavors, always prompt "Name it."
  const [title,sub]=cur.children.every(c=>!c.children)?PROMPTS[PROMPTS.length-1]:PROMPTS[depth];
  const h=document.createElement('h1'); h.className='prompt'; h.textContent=title;
  if(sub){ const s=document.createElement('small'); s.textContent=sub; h.appendChild(s); }
  main.appendChild(h);

  (mode==='grid'?renderGrid:renderCards)(main,cur);
}

function renderGrid(main,cur){
  const g=document.createElement('div'); g.className='grid';
  cur.children.forEach((node,i)=>{
    const b=document.createElement('button');
    b.className=node.children?'tile':'tile is-leaf'; paint(b,node,i);
    b.style.animationDelay=`${i*22}ms`;
    if(node.children){ const c=document.createElement('span'); c.className='count'; c.textContent=node.children.length; b.appendChild(c); }
    const l=document.createElement('span'); l.className='lbl'; l.textContent=node.label; b.appendChild(l);
    b.onclick=()=>drill(node,i);
    g.appendChild(b);
  });
  main.appendChild(g);
}

function renderCards(main,cur){
  const kids=cur.children, node=kids[cardIndex];
  const stage=document.createElement('div'); stage.className='stage';
  const prev=document.createElement('button'); prev.className='nav'; prev.textContent='‹'; prev.setAttribute('aria-label','Previous');
  const next=document.createElement('button'); next.className='nav'; next.textContent='›'; next.setAttribute('aria-label','Next');
  const wrap=document.createElement('div'); wrap.className='card-wrap';
  const card=document.createElement('button');
  card.className='card '+(lastDir==='l'?'in-l':'in-r')+(node.children?'':' is-leaf');
  paint(card,node,cardIndex);
  if(node.children){ const c=document.createElement('span'); c.className='count'; c.textContent=node.children.length; card.appendChild(c); }
  const l=document.createElement('span'); l.className='lbl'; l.textContent=node.label; card.appendChild(l);
  const s=document.createElement('span'); s.className='sub';
  s.textContent=node.children?'tap to dive in':'a flavor — swipe for more'; card.appendChild(s);

  const step=d=>{ lastDir=d>0?'r':'l'; cardIndex=(cardIndex+d+kids.length)%kids.length; render(); };
  prev.onclick=()=>step(-1); next.onclick=()=>step(1);

  // swipe / drag
  let x0=null,dx=0;
  card.addEventListener('pointerdown',e=>{ x0=e.clientX; dx=0; card.setPointerCapture(e.pointerId); card.style.transition='none'; });
  card.addEventListener('pointermove',e=>{ if(x0===null)return; dx=e.clientX-x0; card.style.transform=`translateX(${dx}px) rotate(${dx/40}deg)`; });
  card.addEventListener('pointerup',()=>{
    card.style.transition=''; card.style.transform='';
    if(Math.abs(dx)>60) step(dx<0?1:-1);
    else if(Math.abs(dx)<8 && node.children) drill(node,cardIndex);
    x0=null;
  });
  card.addEventListener('pointercancel',()=>{ card.style.transform=''; x0=null; });

  wrap.appendChild(card); stage.append(prev,wrap,next); main.appendChild(stage);
  const c=document.createElement('div'); c.className='counter';
  c.textContent=`${cardIndex+1} / ${kids.length}`; main.appendChild(c);
}

function renderLeaf(main,node){
  const d=document.createElement('div'); d.className='leaf'; paint(d,node);
  const l=document.createElement('span'); l.className='lbl'; l.textContent=node.label; d.appendChild(l);
  main.appendChild(d);
  const n=document.createElement('p'); n.className='leaf-note';
  n.textContent='Found it. Tap any layer above to keep exploring.'; main.appendChild(n);
}

$('#search').addEventListener('input',()=>render());
document.addEventListener('keydown',e=>{
  const si=$('#search');
  if(e.target===si){ if(e.key==='Escape'){ si.value=''; si.blur(); render(); } return; }
  if(e.key==='/'){ e.preventDefault(); si.focus(); return; }
  if(e.key==='Escape'||e.key==='Backspace'){ if(path.length>1){ e.preventDefault(); jumpTo(path.length-2);} }
  if(mode==='cards'&&path.at(-1).children){
    if(e.key==='ArrowLeft'){ lastDir='l'; cardIndex=(cardIndex-1+path.at(-1).children.length)%path.at(-1).children.length; render(); }
    if(e.key==='ArrowRight'){ lastDir='r'; cardIndex=(cardIndex+1)%path.at(-1).children.length; render(); }
    if(e.key==='Enter'&&document.activeElement?.className!=='nav'){ const n=path.at(-1).children[cardIndex]; if(n.children&&document.activeElement?.classList.contains('card')) drill(n,cardIndex); }
  }
});

$('#mGrid').setAttribute('aria-pressed',mode==='grid');
$('#mCards').setAttribute('aria-pressed',mode==='cards');
setDepth(depth); // sets toggle state and does the initial render from the URL
</script>
</body>
</html>
